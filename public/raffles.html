<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Raffles | RFL PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #09090b; 
            --card: #131316; 
            --primary-blue: #5516b7;
            --primary-purple: #7c3aed;
            --primary-purple-light: #9f36f1;
            --text: #ffffff;
            --text-muted: #84848a;
            --accent-green: #34c759;
            --danger: #ff453a;
            --gold: #ffd700;
            
            /* Локальный неоновый фон из папки public/static */
            --card-bg-img: url('/static/bg-neon.png'); 
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: fixed; 
            overflow: hidden; 
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
        }

        /* === КОНТЕЙНЕР === */
        #main-content {
            height: 100%;
            flex: 1;
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
            padding: 8px 12px 110px 12px;
        }

        /* === PULL TO REFRESH === */
        #pull-to-refresh {
            position: fixed; top: -80px; left: 0; width: 100%; height: 80px;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; background: transparent; pointer-events: none;
            will-change: transform;
        }
        #pull-to-refresh i {
            font-size: 20px; color: var(--primary-purple-light);
            transition: opacity 0.2s, transform 0.2s;
            text-shadow: 0 0 10px rgba(124, 58, 237, 0.7);
        }

        /* === ПРЕМИУМ GLASS-БАННЕР (УЛЬТРА-КОМПАКТНЫЙ) === */
        .premium-banner {
            border-radius: 14px;
            padding: 9px 10px 9px 12px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.18) 0%, rgba(19, 19, 24, 0.65) 55%, rgba(85, 22, 183, 0.22) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(159, 54, 241, 0.35);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .premium-banner::before {
            content: '';
            position: absolute;
            top: -60%; left: -20%;
            width: 140px; height: 140px;
            background: radial-gradient(circle, rgba(159, 54, 241, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }
        .premium-banner.active-sub {
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.16) 0%, rgba(19, 19, 24, 0.7) 60%, rgba(52, 199, 89, 0.12) 100%);
            border-color: rgba(52, 199, 89, 0.4);
        }
        .prem-left {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
            z-index: 1;
        }
        .prem-desc {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.25;
            letter-spacing: -0.1px;
        }
        .prem-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1;
            flex-shrink: 0;
        }
        .prem-btn {
            background: linear-gradient(135deg, #6d28d9 0%, #5516b7 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 10px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(85, 22, 183, 0.5);
        }
        .prem-btn:active { transform: scale(0.95); }
        .prem-btn.active-badge {
            background: rgba(52, 199, 89, 0.18);
            border-color: rgba(52, 199, 89, 0.35);
            color: #34c759;
            box-shadow: none;
        }
        .prem-close-btn {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            padding: 0;
        }
        .prem-close-btn:active { transform: scale(0.9); color: #fff; }

        /* === СТРОКА СТАТИСТИКИ ПОД ПРЕМИУМОМ === */
        .stats-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 7px 12px;
            margin-bottom: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .stats-left {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
        }
        .stats-icon {
            width: 20px; height: 20px;
            border-radius: 6px;
            background: rgba(159, 54, 241, 0.15);
            color: var(--primary-purple-light);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .stats-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-count {
            color: #fff;
            font-weight: 800;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-variant-numeric: tabular-nums;
        }
        .restore-prem-pill {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.25);
            color: var(--gold);
            border-radius: 7px;
            padding: 2px 7px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 4px;
        }

        /* === КОМПАКТНЫЕ ТАБЫ === */
        .tabs-bar {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.03); 
            border-radius: 12px; padding: 3px; margin-bottom: 10px; gap: 4px;
        }
        .tab-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 5px; padding: 7px 6px; border-radius: 9px; font-size: 11px; font-weight: 600;
            color: var(--text-muted); background: transparent; border: none; cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .tab-btn i { font-size: 11px; }
        .tab-btn.active { background: var(--primary-blue); color: #fff; }
        .tab-counter {
            background: rgba(255, 255, 255, 0.15); color: #fff; font-size: 9px;
            padding: 1px 5px; border-radius: 6px; min-width: 12px; text-align: center;
        }

        /* === КАРТОЧКА РОЗЫГРЫША (СУЖЕНА ПОД 3 ШТУКИ НА ЭКРАН + ОПТИМИЗИРОВАНА) === */
        .card { 
            position: relative; overflow: hidden; border-radius: 14px; 
            margin-bottom: 9px; 
            background-color: var(--card);
            background-image: var(--card-bg-img);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid rgba(255, 255, 255, 0.06); 
            display: flex; flex-direction: column;
            contain: content;
        }
        /* Затемняющая подложка для читаемости текста поверх bg-neon.png */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(12, 12, 16, 0.88) 0%, rgba(12, 12, 16, 0.68) 60%, rgba(12, 12, 16, 0.35) 100%);
            pointer-events: none;
            z-index: 0;
        }
        .card.hidden-tab { display: none; }

        .card_content {
            padding: 10px 12px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        /* Верхняя строка карточки: Плашка + Участники/Шанс */
        .card-top-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            flex-wrap: wrap;
            max-width: 66%;
        }

        .r-label { 
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(43, 10, 89, 0.85); 
            border: 1px solid rgba(159, 54, 241, 0.3);
            border-radius: 8px; padding: 2px 7px;
            font-size: 8px; font-weight: 800; color: var(--primary-purple-light);
            text-transform: uppercase;
        }
        .r-label-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary-purple-light); }

        .r-title {
            font-size: 14px; font-weight: 800; color: #fff;
            margin: 0 0 6px 0; line-height: 1.15;
            max-width: 64%; letter-spacing: -0.2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Условия (компактными чипсами в ряд для экономии высоты) */
        .conditions {
            display: flex; flex-direction: row; flex-wrap: wrap;
            gap: 4px; margin-bottom: 6px; max-width: 66%;
        }
        .cond-row {
            font-size: 10px; color: #d4d4d8;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 2px 6px; border-radius: 6px;
            display: inline-flex; align-items: center; gap: 4px; font-weight: 500;
            line-height: 1.2;
        }
        .cond-row b, .cond-row span.val { color: #fff; font-weight: 700; }
        .cond-icon-box {
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .cond-icon-box i { color: var(--primary-purple-light); font-size: 9px; }

        /* Картинка оружия (компактная и без тяжелого drop-shadow для слабых телефонов) */
        .prize-img-wrapper { 
            position: absolute; top: 6px; right: -6px; 
            width: 132px; height: 84px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2; pointer-events: none; 
        }
        .prize-img {
            width: 100%; max-height: 100%; object-fit: contain;
            transform: rotate(-3deg) translateZ(0);
        }

        /* Строка "Участники | Шанс" */
        .participants-info {
            display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
            font-size: 10px; color: var(--text-muted); font-weight: 500;
            max-width: 66%;
        }
        .participants-info b { color: #fff; font-weight: 700; }
        .chance-badge {
            background: rgba(255, 215, 0, 0.1); color: var(--gold); padding: 1px 6px;
            border-radius: 7px; font-size: 9px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 3px; border: 1px solid rgba(255, 215, 0, 0.2); cursor: pointer;
        }

        /* === ТАЙМЕР И КНОПКА (НИЖНЯЯ ПАНЕЛЬ КАРТОЧКИ) === */
        .card-footer-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 7px; border-top: 1px solid rgba(255, 255, 255, 0.07);
            gap: 8px;
        }

        .timer_row { display: flex; align-items: center; gap: 8px; margin: 0; }
        .timer_item { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .timer_val { font-size: 14px; font-weight: 800; color: #ffffff; line-height: 1; font-variant-numeric: tabular-nums; }
        .timer_lbl { font-size: 8px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
        
        .timer-divider {
            width: 1px; height: 12px; background: rgba(255,255,255,0.12); margin: 0 1px;
        }

        .footer-right-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        /* Кнопка Участвовать (Компактная) */
        .btn-main {
            background: var(--primary-blue); color: #fff; border: none;
            padding: 7px 12px; border-radius: 10px; font-size: 11px; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
            transition: transform 0.1s ease;
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-main.joined { background: rgba(52, 199, 89, 0.18); color: var(--accent-green); cursor: default; }
        .btn-main i { font-size: 11px; }

        .user-tickets-info { text-align: right; font-size: 9px; color: var(--text-muted); font-weight: 500; line-height: 1; }
        .user-tickets-info b { color: var(--primary-purple-light); }

        .winner_box { 
            margin-top: 4px; background: rgba(255,255,255,0.03); border-radius: 10px; 
            padding: 7px 10px; border: 1px solid rgba(255,255,255,0.05); 
            display: flex; align-items: center; justify-content: space-between;
        }
        .w-title { font-size: 8px; color: var(--gold); text-transform: uppercase; font-weight: 800; margin-bottom: 1px; letter-spacing: 0.4px; }
        .w-user { font-size: 12px; font-weight: 700; color: #fff; }

        .bottom-spacer { height: 80px; width: 100%; pointer-events: none; }

        /* FOOTER */
        .app-footer {
            display: flex; justify-content: space-around; align-items: center;
            background-color: rgba(9, 9, 11, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999;
            padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }
        .footer-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a1a1aa; text-decoration: none; flex: 1; font-size: 10px; }
        .footer-item .icon-wrapper { font-size: 22px; }

        .hidden { display: none !important; }
        
        /* МОДАЛКИ */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 3000; display: none; align-items: center; justify-content: center; 
        }
        .modal-box { 
            background: var(--card); width: 85%; max-width: 320px; border-radius: 20px; padding: 24px 20px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.07); 
            animation: zoom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
        .m-btn-confirm { background: var(--primary-blue); color: #fff; border: none; flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .m-btn-cancel { background: rgba(255,255,255,0.05); color: #fff; border: none; flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
        
        .m-head { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .m-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        .m-btn { 
            background: rgba(255,255,255,0.05); color: #fff; border: none; width: 100%; 
            padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 8px;
        }
        .m-btn-primary { background: var(--primary-blue); color: #fff; font-weight: 700; }

        /* АНИМАЦИИ И ЛОАДЕРЫ */
        .icon-container { width: 60px; height: 60px; margin: 0 auto 12px; position: relative; }
        .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: var(--accent-green); fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark { width: 60px; height: 60px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px var(--accent-green); animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        .cross-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: var(--danger); fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .cross { width: 60px; height: 60px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px var(--danger); animation: fill-red .4s ease-in-out .4s forwards, shake .3s ease-in-out .9s both; }
        .cross-path { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }

        .verify-modal-content {
            background: var(--card); padding: 24px 30px; border-radius: 20px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); animation: zoom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .verify-loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--primary-purple-light); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        .verify-text { font-size: 16px; font-weight: 700; color: #fff; margin: 0; }
        .verify-subtext { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 50px var(--accent-green); } }
        @keyframes fill-red { 100% { box-shadow: inset 0px 0px 0px 50px var(--danger); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);} 20%, 40%, 60%, 80% {transform: translateX(5px);} }
        @keyframes zoom { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .fa-spin { animation: spin 1s linear infinite !important; }
    </style>
</head>
<body>

    <div id="pull-to-refresh">
        <i class="fa-solid fa-rotate-right"></i> 
    </div>

    <main id="main-content">
        <!-- 🔥 GLASS-БАННЕР ПРЕМИУМ-ДОСТУПА (СКРЫВАЕМЫЙ) 🔥 -->
        <div id="premium-banner" class="premium-banner" onclick="openPremiumModal()">
            <div class="prem-left">
                <div class="prem-desc" id="prem-desc-text">Авто-участие + 4 входа без условий на 30 дней</div>
            </div>
            <div class="prem-actions">
                <button class="prem-btn" id="prem-action-btn" onclick="event.stopPropagation(); openPremiumModal();">
                    Купить • 100 ₽
                </button>
                <button class="prem-close-btn" title="Скрыть" onclick="hidePremiumBanner(event)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- 🔥 СТАТИСТИКА РАЗЫГРАННЫХ СКИНОВ 🔥 -->
        <div class="stats-bar">
            <div class="stats-left">
                <span class="stats-icon"><i class="fa-solid fa-trophy"></i></span>
                <span>Разыграно скинов:</span>
            </div>
            <div class="stats-right">
                <button id="restore-prem-btn" class="restore-prem-pill" onclick="restorePremiumBanner()">
                    <i class="fa-solid fa-bolt"></i> Премиум
                </button>
                <span class="stats-count" id="raffled-skins-count">0</span>
            </div>
        </div>

        <!-- ТАБЫ -->
        <div class="tabs-bar">
            <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
                <i class="fa-solid fa-gift"></i>
                <span>Активные</span>
                <span class="tab-counter" id="active-tab-count">0</span>
            </button>
            <button class="tab-btn" id="tab-completed" onclick="switchTab('completed')">
                <i class="fa-solid fa-check-double"></i>
                <span>Завершённые</span>
            </button>
        </div>

        <!-- СПИСОК КАРТОЧЕК -->
        <div id="list">
            <div style="text-align:center; margin-top:40px; color:var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            </div>
        </div>

        <div id="close-btn-container" class="close-container hidden" style="position: fixed; bottom: 80px; width: 100%; text-align: center; z-index: 99; left: 0;">
            <button class="btn-main" style="width: auto; padding: 10px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);" onclick="tg.close()">Закрыть</button>
        </div>
    </main>

    <script src="/top_nav.js" defer></script>
    <script src="/bottom-nav.js"></script>

    <!-- МОДАЛКА СПИСАНИЯ БИЛЕТОВ -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 40px; margin-bottom: 10px;">🎫</div>
            <div style="font-size: 20px; font-weight: 800; margin-bottom: 6px; color: #fff;">Подтвердите</div>
            <div style="color: var(--text-muted); margin-bottom: 20px; font-size: 13px;">Списать <b id="ticket-price" style="color:#fff">--</b> билетов?</div>
            <div class="modal-btns">
                <button class="m-btn-cancel" onclick="closeConfirm()">Отмена</button>
                <button class="m-btn-confirm" id="confirm-join-btn">Да, списать</button>
            </div>
        </div>
    </div>

    <!-- 🔥 МОДАЛКА ПРЕМИУМ-ДОСТУПА 🔥 -->
    <div id="premium-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 40px; margin-bottom: 10px;">⚡</div>
            <div class="m-head">Премиум-доступ</div>
            <div class="m-desc" id="prem-modal-desc" style="text-align: left; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="margin-bottom: 6px; color: #fff; font-weight: 700;">Привилегия на 30 дней:</div>
                <div style="margin-bottom: 4px;">⚡ <b>Авто-участие:</b> бот сам добавляет вас.</div>
                <div style="margin-bottom: 4px;">🎟 <b>4 пропуска:</b> участие без условий.</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">Стоимость: <b style="color: var(--gold);">100 ₽</b> на 30 дней</div>
            </div>
            <button id="buy-prem-btn" class="m-btn m-btn-primary" onclick="buyRafflesPremium()">
                💳 Оплатить 100 ₽
            </button>
            <button class="m-btn" onclick="closePremiumModal()">Закрыть</button>
        </div>
    </div>

    <!-- УНИВЕРСАЛЬНАЯ МОДАЛКА -->
    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="icon-container"></div>
            <div class="m-head" id="m-head"></div>
            <div class="m-desc" id="m-desc"></div>
            <button id="btn-profile" class="m-btn m-btn-primary" style="display:none;" onclick="location.href='/profile'">⚙️ Настроить профиль</button>
            <button id="btn-bp" class="m-btn m-btn-primary" style="display:none; background: var(--gold); color: #000;" onclick="location.href='/checkpoint'">🌟 Battle Pass</button>
            <button class="m-btn" onclick="document.getElementById('modal').style.display='none'">Понятно</button>
        </div>
    </div>

    <div id="verify-modal" class="modal-overlay" style="z-index: 3000;">
        <div class="verify-modal-content">
            <div class="verify-loader"></div>
            <div class="verify-text">Проверка...</div>
            <span class="verify-subtext">Сверяем данные</span>
        </div>
    </div>

    <script>
        window.makeApiRequest = async function(url, data = {}, method = 'POST', silent = false) {
            const options = { method: method, headers: { 'Content-Type': 'application/json' } };
            if (method === 'POST') { options.body = JSON.stringify({ initData: window.Telegram?.WebApp?.initData || '', ...data }); }
            const response = await fetch(url, options);
            if (!response.ok) throw new Error('API Error');
            return await response.json();
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.hide();

        let userTickets = 0;
        let userHasRafflesPremium = false;
        let userFreePasses = 0;
        let userPremiumUntil = null;
        let userTotalRaffledFromProfile = 0;
        let currentTab = 'active';
        let cachedTimerNodes = [];

        // Управление скрытием/показом Премиум-баннера
        function checkPremiumBannerVisibility() {
            const isHidden = localStorage.getItem('hide_raffles_prem_banner') === '1';
            const banner = document.getElementById('premium-banner');
            const restoreBtn = document.getElementById('restore-prem-btn');
            if (banner && restoreBtn) {
                if (isHidden) {
                    banner.classList.add('hidden');
                    restoreBtn.style.display = 'inline-flex';
                } else {
                    banner.classList.remove('hidden');
                    restoreBtn.style.display = 'none';
                }
            }
        }

        function hidePremiumBanner(e) {
            if (e) e.stopPropagation();
            localStorage.setItem('hide_raffles_prem_banner', '1');
            checkPremiumBannerVisibility();
        }

        function restorePremiumBanner() {
            localStorage.removeItem('hide_raffles_prem_banner');
            checkPremiumBannerVisibility();
        }

        function initPullToRefresh() {
            const content = document.getElementById('main-content');
            const ptrContainer = document.getElementById('pull-to-refresh');
            const icon = ptrContainer ? ptrContainer.querySelector('i') : null;
            if (!content || !ptrContainer || !icon) return;

            let startY = 0; let pulledDistance = 0; let isPulling = false; const triggerThreshold = 80;

            content.addEventListener('touchstart', (e) => {
                if (content.scrollTop <= 0) {
                    startY = e.touches[0].clientY; isPulling = true;
                    content.style.transition = 'none'; ptrContainer.style.transition = 'none'; icon.style.transition = 'none';
                } else { isPulling = false; }
            }, { passive: true });

            content.addEventListener('touchmove', (e) => {
                if (!isPulling) return;
                const currentY = e.touches[0].clientY; const diff = currentY - startY;
                if (diff > 0 && content.scrollTop <= 0) {
                    if (e.cancelable) e.preventDefault();
                    pulledDistance = Math.pow(diff, 0.85); if (pulledDistance > 180) pulledDistance = 180;
                    content.style.transform = `translateY(${pulledDistance}px)`;
                    ptrContainer.style.transform = `translateY(${pulledDistance}px)`;
                    icon.style.transform = `rotate(${pulledDistance * 2.5}deg)`;
                    if (pulledDistance > triggerThreshold) { icon.style.color = "#34c759"; } 
                    else { icon.style.color = "var(--primary-purple-light)"; }
                }
            }, { passive: false });

            content.addEventListener('touchend', () => {
                if (!isPulling) return;
                isPulling = false;
                content.style.transition = 'transform 0.3s ease-out'; ptrContainer.style.transition = 'transform 0.3s ease-out';
                if (pulledDistance > triggerThreshold) {
                    content.style.transform = `translateY(80px)`; ptrContainer.style.transform = `translateY(80px)`;
                    icon.style.transform = ''; icon.classList.add('fa-spin');
                    if (window.Telegram && Telegram.WebApp.HapticFeedback) { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); }
                    setTimeout(() => { window.location.reload(); }, 500);
                } else {
                    content.style.transform = 'translateY(0px)'; ptrContainer.style.transform = 'translateY(0px)';
                    icon.style.transform = 'rotate(0deg)';
                }
                pulledDistance = 0;
            });
        }
            
        document.body.addEventListener('click', (e) => {
            const selector = `a, button, .history-btn, .card, .m-btn, .chance-span, .premium-banner, .tab-btn`;
            if (e.target.closest(selector)) {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    try { window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); } catch (err) {}
                }
            }
        });

        function closeConfirm() { document.getElementById('confirm-modal').style.display = 'none'; }
        function openPremiumModal() { document.getElementById('premium-modal').style.display = 'flex'; }
        function closePremiumModal() { document.getElementById('premium-modal').style.display = 'none'; }

        function updatePremiumBannerUI(uData) {
            userFreePasses = parseInt(uData.free_raffle_passes || 0);
            userPremiumUntil = uData.raffles_premium_until || null;
            userHasRafflesPremium = false;

            if (uData.total_raffled || uData.raffled_skins_count) {
                userTotalRaffledFromProfile = parseInt(uData.total_raffled || uData.raffled_skins_count || 0);
            }

            if (uData.has_raffles_premium && userPremiumUntil) {
                const dtUntil = new Date(userPremiumUntil);
                if (dtUntil > new Date()) { userHasRafflesPremium = true; }
            }

            const banner = document.getElementById('premium-banner');
            const descText = document.getElementById('prem-desc-text');
            const actionBtn = document.getElementById('prem-action-btn');
            const buyBtn = document.getElementById('buy-prem-btn');

            if (userHasRafflesPremium) {
                const untilStr = new Date(userPremiumUntil).toLocaleDateString('ru-RU');
                banner.classList.add('active-sub');
                descText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#34c759; margin-right:4px;"></i>Активен до ${untilStr} • Авто-участие + <b>${userFreePasses}</b> проп.`;
                actionBtn.className = 'prem-btn active-badge';
                actionBtn.innerHTML = `🎟 ${userFreePasses}`;
                if (buyBtn) buyBtn.innerText = '💳 Продлить (+30 дней) • 100 ₽';
            } else {
                banner.classList.remove('active-sub');
                descText.innerText = `Авто-участие + 4 входа без условий на 30 дней`;
                actionBtn.className = 'prem-btn';
                actionBtn.innerHTML = `Купить • 100 ₽`;
                if (buyBtn) buyBtn.innerText = '💳 Оплатить 100 ₽';
            }
        }

        async function buyRafflesPremium() {
            const btn = document.getElementById('buy-prem-btn');
            const oldText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Создаём ссылку...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/v1/payment/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData, action_type: 'raffles_premium' })
                });
                const ans = await res.json();
                if (res.ok && ans.url) {
                    closePremiumModal();
                    if (tg.openLink) { tg.openLink(ans.url); } else { window.location.href = ans.url; }
                } else { showModal('error', 'Ошибка оплаты', ans.detail || 'Не удалось получить ссылку'); }
            } catch (e) { showModal('error', 'Ошибка', 'Проверьте интернет-соединение'); } 
            finally { btn.innerHTML = oldText; btn.disabled = false; }
        }

        // CSS-логика переключения табов без перерендера
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('tab-' + tabName);
            if (activeBtn) activeBtn.classList.add('active');

            document.querySelectorAll('.card').forEach(card => {
                const isCompleted = card.classList.contains('done');
                if (tabName === 'active') {
                    if (isCompleted) card.classList.add('hidden-tab');
                    else card.classList.remove('hidden-tab');
                } else if (tabName === 'completed') {
                    if (!isCompleted) card.classList.add('hidden-tab');
                    else card.classList.remove('hidden-tab');
                }
            });

            const emptyActive = document.getElementById('empty-active-msg');
            const emptyCompleted = document.getElementById('empty-completed-msg');
            if (emptyActive) emptyActive.style.display = (tabName === 'active') ? 'block' : 'none';
            if (emptyCompleted) emptyCompleted.style.display = (tabName === 'completed') ? 'block' : 'none';
        }

        function showChanceInfo(e) {
            e.stopPropagation(); 
            showModal('info', 'Шанс победы', 'Процент победы рассчитывается делением 100% на количество участников. Чем больше участников, тем ниже шанс, но победить может каждый! 🍀');
        }

        function getPlural(n, titles) {
            return titles[(n % 10 === 1 && n % 100 !== 11) ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2];
        }

        // Оптимизированный таймер по кэшированным узлам (без поиска по всему DOM каждую секунду)
        setInterval(() => {
            if (currentTab !== 'active' || !cachedTimerNodes.length) return;
            const now = Date.now();
            for (let i = 0; i < cachedTimerNodes.length; i++) {
                const item = cachedTimerNodes[i];
                const diff = item.endTime - now;
                if (diff <= 0) {
                    if (!item.expired) {
                        item.el.innerHTML = '<span style="color:var(--danger); font-weight:700; font-size:11px;">ЗАВЕРШАЕТСЯ...</span>';
                        item.expired = true;
                    }
                    continue;
                }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);
                if (item.dEl) item.dEl.textContent = d;
                if (item.hEl) item.hEl.textContent = h;
                if (item.mEl) item.mEl.textContent = m;
                if (item.sEl) item.sEl.textContent = s;
            }
        }, 1000);

        async function load() {
            try {
                // Параллельная загрузка обоих эндпоинтов для максимальной скорости на слабых устройствах
                const [uRes, res] = await Promise.all([
                    fetch('/api/v1/user/me', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({initData:tg.initData}) }),
                    fetch('/api/v1/raffles/active', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({initData:tg.initData}) })
                ]);

                const [uData, data] = await Promise.all([uRes.json(), res.json()]);

                userTickets = uData.tickets || 0;
                updatePremiumBannerUI(uData);

                renderAll(Array.isArray(data) ? data : []);
                checkDeepLink(); 
            } catch(e) {
                document.getElementById('list').innerHTML = '<p style="text-align:center; font-size:13px; color:var(--text-muted);">Ошибка сети</p>';
            }
        }

        function renderAll(data) {
            const list = document.getElementById('list');
            
            const validData = data.filter(r => {
                if (r.status === 'scheduled') return false;
                if (r.status === 'completed' && !r.winner) return false;
                return true;
            });

            let activeRaffles = validData.filter(r => r.status !== 'completed');
            let completedRaffles = validData.filter(r => r.status === 'completed');

            activeRaffles.sort((a, b) => new Date(a.end_time || 0) - new Date(b.end_time || 0));
            completedRaffles.sort((a, b) => new Date(b.end_time || 0) - new Date(a.end_time || 0));

            const tabCountEl = document.getElementById('active-tab-count');
            if (tabCountEl) tabCountEl.textContent = activeRaffles.length;

            // Обновляем статистику разыгранных скинов
            const statsCountEl = document.getElementById('raffled-skins-count');
            if (statsCountEl) {
                const totalRaffled = userTotalRaffledFromProfile > completedRaffles.length ? userTotalRaffledFromProfile : completedRaffles.length;
                statsCountEl.textContent = totalRaffled;
            }

            const sortedData = [...activeRaffles, ...completedRaffles];
            let htmlBuffer = '';

            sortedData.forEach(r => {
                const done = r.status === 'completed';
                const isTwitch = r.type && r.type.includes('twitch');
                const s = r.settings || {};
                const pCount = r.participants_count || 0;

                const img = s.card_image || s.prize_image || r.image_url || '';
                const prizeName = s.prize_name || r.title || 'Приз';
                const fullPrizeName = `${prizeName} ${s.skin_quality ? `(${s.skin_quality})` : ''}`;

                let conditions = '';
                if (!done) {
                    if (isTwitch) {
                        conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-brands fa-twitch"></i></span> <span>Стрим</span></div>`;
                        if (s.cost) conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-coins" style="color:#ffd700;"></i></span> <span>${s.cost} баллов</span></div>`;
                        if (s.min_lifetime_msgs > 0) conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-comment-dots"></i></span> <span>Сообщ: <b>${s.min_lifetime_msgs}</b></span></div>`;
                        if (s.is_for_newbies) conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-seedling" style="color:#34c759;"></i></span> <span>Новичкам</span></div>`;
                    } else {
                        if (s.requires_telegram_sub) {
                            conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-paper-plane"></i></span> <span>Подписка</span></div>`;
                        }
                        
                        const minMsgs = s.min_messages || s.min_daily_messages || 0;
                        const msgPeriod = s.message_period || 'daily';
                        const periodMap = { 'daily': 'стрим', 'weekly': 'нед.', 'monthly': 'мес.' };
                        const periodStr = periodMap[msgPeriod] || 'стрим';

                        if (minMsgs > 0) {
                            conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-comment-dots"></i></span> <span>${minMsgs} сообщ/${periodStr}</span></div>`;
                        }
                        
                        if (s.min_participants > 0) {
                            conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-users"></i></span> <span>От <b>${s.min_participants}</b> уч.</span></div>`;
                        }
                        if (s.min_bp_level > 0) {
                            conditions += `<div class="cond-row"><span class="cond-icon-box"><i class="fa-solid fa-star" style="color: #ffd700;"></i></span> <span>БП <b>${s.min_bp_level}</b> ур.</span></div>`;
                        }
                    }
                }

                let btnHtml = ""; let ticketInfo = "";

                if (!done) {
                    if (isTwitch) {
                        btnHtml = `<button class="btn-main" onclick="window.Telegram.WebApp.openLink('https://twitch.tv/hatelove_ttv')"><i class="fa-brands fa-twitch"></i> На Twitch <span>→</span></button>`;
                        ticketInfo = `<div class="user-tickets-info">Чат: <b>!розыгрыш</b></div>`;
                    } else {
                        let btnLabel = `<i class="fa-solid fa-ticket"></i> Участвовать <span>→</span>`;
                        if (!r.is_joined && s.ticket_cost > 0) {
                            btnLabel = `<i class="fa-solid fa-ticket"></i> ${s.ticket_cost} бил. <span>→</span>`;
                            ticketInfo = `<div class="user-tickets-info">У вас: <b>${userTickets}</b> бил.</div>`;
                        }
                        btnHtml = `<button class="btn-main ${r.is_joined ? 'joined' : ''}" onclick="handleJoin(${r.id}, ${s.ticket_cost || 0}, ${r.is_joined})">
                                    ${r.is_joined ? '<i class="fa-solid fa-check"></i> Участвуете' : btnLabel}
                                   </button>`;
                    }
                }

                let pTextFinal = "";
                if (!done && pCount > 0) {
                    const chanceVal = (100 / pCount).toFixed(2).replace('.00', '');
                    pTextFinal = `
                        <div class="participants-info">
                            <span><b>${pCount}</b> ${getPlural(pCount, ['участник', 'участника', 'участников'])}</span>
                            <span class="chance-badge" onclick="showChanceInfo(event)">🔥 ${chanceVal}% <i class="fa-solid fa-circle-info" style="font-size:8px;"></i></span>
                        </div>
                    `;
                } else if (!done && pCount === 0) {
                    pTextFinal = `<div class="participants-info"><span><b>0</b> участников</span></div>`;
                }
                
                let winnerBoxContent = '';
                if (r.winner) { winnerBoxContent = `<div class="w-user">🏆 ${r.winner.full_name || r.winner.username || r.winner.twitch_login || 'Победитель'}</div>`; } 
                else { winnerBoxContent = `<div class="w-user">⏳ Выбор победителя...</div>`; }

                let timerBlock = '';
                if (!done) {
                    if (r.end_time) {
                        timerBlock = `
                            <div class="timer_row timer-data" data-time="${r.end_time}">
                                <div class="timer_item"><span class="timer_val d-v">0</span><span class="timer_lbl">дн</span></div>
                                <div class="timer-divider"></div>
                                <div class="timer_item"><span class="timer_val h-v">0</span><span class="timer_lbl">час</span></div>
                                <div class="timer_item"><span class="timer_val m-v">0</span><span class="timer_lbl">мин</span></div>
                                <div class="timer_item"><span class="timer_val s-v">0</span><span class="timer_lbl">сек</span></div>
                            </div>`;
                    } else if (isTwitch) {
                        timerBlock = `<div style="font-size:11px; font-weight:800; color:var(--primary-purple-light); letter-spacing: 0.2px;"><i class="fa-solid fa-bolt"></i> ИТОГИ НА СТРИМЕ</div>`;
                    }
                }

                const isHidden = (currentTab === 'active' && done) || (currentTab === 'completed' && !done);

                htmlBuffer += `
                <div class="card ${done ? 'done' : ''} ${isHidden ? 'hidden-tab' : ''}">
                    <div class="card_content">
                        <div class="prize-img-wrapper"><img src="${img}" class="prize-img" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
                        <div class="card-top-meta">
                            <div class="r-label"><span class="r-label-dot"></span> ${isTwitch ? 'TWITCH РОЗЫГРЫШ' : 'РОЗЫГРЫШ'}</div>
                        </div>
                        <h3 class="r-title">${fullPrizeName}</h3>
                        ${!done && conditions ? `<div class="conditions">${conditions}</div>` : ''}
                        ${!done ? pTextFinal : ''}

                        ${!done ? `
                            <div class="card-footer-bar">
                                ${timerBlock}
                                <div class="footer-right-col">
                                    ${btnHtml}
                                    ${ticketInfo}
                                </div>
                            </div>
                        ` : `
                            <div class="winner_box">
                                <div><div class="w-title">Победитель</div>${winnerBoxContent}</div>
                                <i class="fa-solid fa-trophy" style="color:#ffd700; font-size:16px; opacity:0.85;"></i>
                            </div>
                        `}
                    </div>
                </div>`;
            });

            if (activeRaffles.length === 0) {
                htmlBuffer += `<div id="empty-active-msg" style="display:${currentTab === 'active' ? 'block' : 'none'}; text-align:center; margin-top:40px; color:var(--text-muted); font-size:13px;">Активных розыгрышей нет 👻</div>`;
            }
            if (completedRaffles.length === 0) {
                htmlBuffer += `<div id="empty-completed-msg" style="display:${currentTab === 'completed' ? 'block' : 'none'}; text-align:center; margin-top:40px; color:var(--text-muted); font-size:13px;">Завершённых розыгрышей пока нет 👻</div>`;
            }
            
            htmlBuffer += '<div class="bottom-spacer"></div>';

            // Единовременная вставка в DOM без фризов
            list.innerHTML = htmlBuffer;

            // Кэшируем элементы таймера один раз после рендера
            cachedTimerNodes = Array.from(document.querySelectorAll('.timer-data')).map(el => ({
                el: el,
                endTime: new Date(el.dataset.time).getTime(),
                dEl: el.querySelector('.d-v'),
                hEl: el.querySelector('.h-v'),
                mEl: el.querySelector('.m-v'),
                sEl: el.querySelector('.s-v'),
                expired: false
            }));
        }
        
        function handleJoin(id, cost, isJoined) {
            if(isJoined) return;
            if (cost > 0) {
                document.getElementById('ticket-price').innerText = cost;
                document.getElementById('confirm-modal').style.display = 'flex';
                document.getElementById('confirm-join-btn').onclick = () => { closeConfirm(); join(id); };
            } else { join(id); }
        }

        async function join(id, isAuto = false) {
            let btn = null; let oldHtml = '';
            
            if(!isAuto && window.event) {
                tg.HapticFeedback.impactOccurred('medium');
                let target = window.event.target;
                if(target.tagName !== 'BUTTON') target = target.closest('button');
                
                if (target && !target.classList.contains('joined')) {
                    btn = target; oldHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.style.opacity = '0.7';
                }
            }
            
            try {
                const res = await fetch('/api/v1/raffles/join', { 
                    method: 'POST', headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({initData:tg.initData, raffle_id:id}) 
                });
                const ans = await res.json();
                
                if(res.ok) {
                    tg.HapticFeedback.notificationOccurred('success');
                    if (ans.message.includes("снижены на 20%")) {
                        const formattedMsg = ans.message.replace(/\n/g, '<br>');
                        showModal('info', '⚠️ Внимание! ⚠️', formattedMsg);
                    } else { showModal('success', 'Успех!', ans.message.replace(/\n/g, '<br>')); }
                    load(); 
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                    if (ans.detail && ans.detail.includes('Battle Pass')) {
                        const bpMsg = `${ans.detail}<br><br><span style="font-size: 12px; color: var(--text-muted);">Перейдите в Баттл-пасс и наберите необходимый уровень, чтобы участвовать в таких розыгрышах!</span>`;
                        showModal('bp_error', 'Доступ закрыт 🛑', bpMsg);
                    } else { showModal('error', 'Упс...', ans.detail); }

                    if(btn) { btn.innerHTML = oldHtml; btn.style.opacity = '1'; }
                }
            } catch(e) {
                tg.HapticFeedback.notificationOccurred('error');
                showModal('error', 'Ошибка', 'Проверьте соединение');
                if(btn) { btn.innerHTML = oldHtml; btn.style.opacity = '1'; }
            }
        }

        function showModal(type, title, msg) {
            const m = document.getElementById('modal'); const iconBox = document.getElementById('modal-icon');
            const btnProfile = document.getElementById('btn-profile'); const btnBp = document.getElementById('btn-bp');
            
            btnProfile.style.display = 'none'; btnBp.style.display = 'none';

            if(type === 'success') {
                iconBox.innerHTML = `<svg class="checkmark" viewBox="0 0 52 52"><circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/><path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg>`;
            } else if (type === 'info') {
                iconBox.innerHTML = '<i class="fa-solid fa-circle-info" style="font-size: 50px; color: var(--primary-purple-light); margin-top: 5px;"></i>';
            } else if (type === 'bp_error') {
                iconBox.innerHTML = '<i class="fa-solid fa-star" style="font-size: 50px; color: #ffd700; margin-top: 5px; filter: drop-shadow(0 0 10px rgba(255,215,0,0.4));"></i>';
                btnBp.style.display = 'block';
            } else {
                iconBox.innerHTML = `<svg class="cross" viewBox="0 0 52 52"><circle class="cross-circle" cx="26" cy="26" r="25" fill="none"/><path class="cross-path" fill="none" d="M16 16 36 36 M36 16 16 36"/></svg>`;
                const mLow = msg ? msg.toLowerCase() : '';
                btnProfile.style.display = (mLow.includes('trade') || mLow.includes('twitch') || mLow.includes('профиль') || mLow.includes('билет')) ? 'block' : 'none';
            }

            document.getElementById('m-head').innerText = title;
            document.getElementById('m-desc').innerHTML = msg;
            m.style.display = 'flex';
        }

        async function checkDeepLink() {
            const startParam = tg.initDataUnsafe.start_param; 
            if (startParam && startParam.startsWith('raffle_')) {
                const closeBtn = document.getElementById('close-btn-container');
                if(closeBtn) closeBtn.classList.remove('hidden');

                const raffleId = startParam.split('_')[1];
                if (!sessionStorage.getItem('checked_raffle_' + raffleId)) {
                    const vModal = document.getElementById('verify-modal');
                    if(vModal) vModal.style.display = 'flex';
                    tg.HapticFeedback.impactOccurred('light');
                    await new Promise(r => setTimeout(r, 1000));
                    sessionStorage.setItem('checked_raffle_' + raffleId, 'true');
                    await join(raffleId, true); 
                    if(vModal) vModal.style.display = 'none';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkPremiumBannerVisibility();
            initPullToRefresh();
        });
        load();
    </script>
</body>
</html>
